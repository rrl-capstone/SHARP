# Publishes the results website in docs/ to GitHub Pages (https://nucapstone.github.io/SHARP/)
# on every push to main that changes the site or the results, and on demand from the Actions tab.
# The site's data is rebuilt here from results/ with python -m runner.site_data, so the published
# numbers always match the committed results. Only finished runs are published: a run whose
# run_info.json is not "complete" stops the build, and the site stays as it was.
#
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
# Each action is pinned to a full commit SHA; the comment after it is the release.

name: Publish results website

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "results/**"
      - "runner/site_data.py"
      - "runner/config.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the data export's dependencies
        run: python -m pip install PyYAML==6.0.2 pillow==12.1.1

      - name: Rebuild the site data from results/
        run: python -m runner.site_data

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
